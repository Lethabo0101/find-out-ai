<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Out AI</title>
<style>
body{background:#0f172a;font-family:Arial;color:white;text-align:center;padding:20px}
.box{background:#1e293b;max-width:600px;margin:auto;padding:25px;border-radius:20px;border:3px solid #ec4899}
input{width:90%;padding:15px;border-radius:10px;border:none;font-size:16px}
button{padding:15px 25px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.ask{background:#f472b6;color:white}
.pay{background:#10b981;color:white;width:95%;font-size:18px}
#answer{background:#334155;padding:15px;border-radius:10px;margin-top:15px;text-align:left;min-height:60px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
<h1>Find Out <span style="color:#f97316">AI</span> 🤖</h1>
<p>Ask ANYTHING, Get Answers FAST! Your Smart AI Friend Made With ❤️ By Lethabo Modiba</p>
<p id="left" style="color:#facc15;font-weight:bold">You have 3 FREE questions left!</p>
<input id="q" placeholder="Type your question here...">
<br><button class="ask" onclick="ask()">Ask AI ✨</button>
<div id="answer">Your answer will appear here...</div>
<br><button class="pay" onclick="window.open('https://pay.capitecbank.co.za','_blank')">PAY R50 WITH CAPITEC</button>
<p><small>Knowledge, Fun & Answers For Everyone!</small></p>
</div>
<script>
let count = localStorage.getItem('count');
if(count===null){count=3; localStorage.setItem('count',3);}
function update(){document.getElementById('left').innerText = "You have " + count + " FREE questions left!";}
update();
async function ask(){
let question = document.getElementById('q').value;
if(!question){alert("Type a question first!"); return;}
if(count<=0){alert("You used your free questions! Please PAY R50 to continue."); return;}
document.getElementById('answer').innerText = "Find Out AI is thinking...";
try{
let prompt = encodeURIComponent("You are Find Out AI, a friendly smart AI created by Lethabo Modiba from South Africa. Answer simply and clearly for a student in South Africa. Question: " + question);
let res = await fetch("https://text.pollinations.ai/" + prompt);
let text = await res.text();
document.getElementById('answer').innerText = text;
count--; localStorage.setItem('count',count); update();
}catch(e){document.getElementById('answer').innerText = "Oops! Internet error. Try again.";}
}
</script>
</body>
</html>
